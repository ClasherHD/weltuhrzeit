<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weltzeituhr Dashboard – Wetter & Feiertage</title>
    <meta name="description"
        content="Live-Uhrzeiten, Wetterdaten und Feiertage für alle Länder der Welt in einem modernen Dashboard.">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://clasherhd.github.io/weltuhrzeit/">
    <meta property="og:title" content="Weltzeituhr Dashboard – Die ganze Welt im Blick">
    <meta property="og:description"
        content="Echtzeit-Uhrzeiten, aktuelles Wetter und kommende Feiertage für über 250 Länder.">
    <meta property="og:image" content="https://raw.githubusercontent.com/ClasherHD/weltuhrzeit/main/preview.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>
    <video id="mc-video-bg" class="mc-video-bg" autoplay loop muted playsinline preload="auto">
        <source src="Timelapse_compressed.mp4" type="video/mp4">
        <source src="Timelapse.mp4" type="video/mp4">
    </video>
    <div class="background-overlay"></div>
    <main class="container">
        <header>
            <h1>Weltzeituhr</h1>
            <div class="controls">
                <button id="toggle-format" class="glass-btn">24h / 12h</button>
            </div>
        </header>

        <div class="search-container">
            <input type="text" id="search-input" class="glass-input" placeholder="Land suchen (z.B. Japan, Kanada)...">
            <button id="toggle-fav-filter" class="glass-btn fav-filter-btn">★ Favoriten</button>
        </div>

        <div id="loading" class="loading-spinner">Lade Länderdaten...</div>

        <div class="mini-grid" id="mini-container"></div>
        <div class="countries-grid" id="countries-container" style="display: none;"></div>
    </main>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content" id="modal-content">
            <!-- Modal card injected via JS -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>
    <script src="script.js?v=3"></script>
</body>

</html>
